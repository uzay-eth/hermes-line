# Source of plugin-catalog/hermes-line.yaml, submitted to NousResearch/hermes-agent from uzay-eth (MIT-018).
# Schema: "Entry schema" in https://github.com/NousResearch/hermes-agent/blob/main/plugin-catalog/README.md
# A file cannot contain the sha of its own commit, so this copy leaves `sha` empty and points the screenshot URLs
# at `main`. The submitted copy in the catalog PR pins `sha` and every screenshot URL to the release commit.
# Checked against the repo in docs/release/admission-check.md.

name: hermes-line                       # [a-z0-9_-]{1,64}; same as plugin/plugin.yaml `name`
repo: https://github.com/uzay-eth/hermes-line     # Can's public repo (rule 5: submitted by the owner)
sha: ""                                 # in the catalog PR: the full 40-character release commit (rule 2)
subdir: plugin                          # plugin.yaml, __init__.py, desktop/plugin.js and dashboard/ live here
description: >-
  A phone line for Hermes: with your approval it calls a business from your Twilio account, works the phone
  menu, waits on hold, then bridges you in or finishes the task, and can answer callbacks.
maintainer: uzay-eth                    # Can Uzay's GitHub name
tier: community                         # official/verified are set by Nous maintainers only
category: voice                         # coordinator decision, L7 round 2
requires_hermes: ">=0.22.5"             # same floor as plugin/plugin.yaml (rule 14); tested on v0.22.5
docs_url: ""
version: "0.1.0"                        # matches plugin/plugin.yaml version
image: ""                               # no 2:1 banner exists yet
screenshots:                            # GitHub-hosted; pinned to the release sha in the PR; offline harness renders, sample data
  - https://raw.githubusercontent.com/uzay-eth/hermes-line/main/tools/pane-preview/screenshots/round4/on_hold.png
  - https://raw.githubusercontent.com/uzay-eth/hermes-line/main/tools/pane-preview/screenshots/round4/human_detected.png
  - https://raw.githubusercontent.com/uzay-eth/hermes-line/main/tools/pane-preview/screenshots/round4/owner_connected.png
  - https://raw.githubusercontent.com/uzay-eth/hermes-line/main/tools/pane-preview/screenshots/round4/ended.png
readme: true                            # renders plugin/README.md (subdir) at the pinned sha; relative image links resolve against that tree
platforms: []                           # empty = all; only macOS was tested
title: Hermes Line
onboarding: false                       # official or verified entries only
known_issues:
  - "US numbers only (geographic and toll-free); premium 900/976 and non-US numbers are refused."
  - "Needs a Twilio account, a public HTTPS tunnel to the plugin, the Hermes gateway on the same machine, and a separate Hermes profile with no ACP toolsets for the calls (setup step in the README)."
  - "Waiting on hold was shown live on a real airline hold queue (44 min in silence, 0 phrases spoken into hold). Real agents answered on two Hilton calls, but the live-person check missed them every time; the fix is tested offline only, so detecting a real agent and bridging you in are not yet proven live."
  - "Detecting that a live person answered is experimental: live calls produced one false detection (Delta) and three missed agents (Hilton), all fixed offline and not yet re-proven live; on restricted tasks your phone rings only after a clear yes to the live-person question, or after two human-like but unclear replies so you can judge."
  - "Automated assistants and phone menus get only fixed phrases or keys; many real menus are left unanswered on purpose."
  - "Callbacks from a business are tested offline only; calls forwarded from your own mobile line were answered live twice."
  - "Grok Voice (optional xAI key) was used on one live call; barge-in and key tones on it are unproven."
  - "Owner line mode (call your line, key a PIN) is optional, off unless a PIN is set, experimental, and not yet used on a live call."
  - "Verification codes must arrive on a carrier phone; Twilio numbers filter one-time-code texts (error 30038)."
capabilities:                           # must match what register() registers (rule 6)
  provides_tools:
    - hermes_line_request_call
    - hermes_line_call_status
    - hermes_line_list_tasks
    - hermes_line_say
    - hermes_line_hang_up
    - hermes_line_take_over
    - hermes_line_call_press_digits
    - hermes_line_call_finish
    - hermes_line_call_bring_owner
    - hermes_line_call_new_task         # owner line mode; refused unless the caller passed the PIN
    - line_otp_to_call
  provides_hooks:
    - transform_tool_result
    - transform_llm_output
  provides_middleware: []
  requires_env:
    - HERMES_LINE_TWILIO_ACCOUNT_SID
    - HERMES_LINE_TWILIO_API_KEY_SID
    - HERMES_LINE_TWILIO_API_KEY_SECRET
    # optional_env in plugin.yaml (not part of this schema): HERMES_LINE_TWILIO_AUTH_TOKEN, XAI_API_KEY,
    # HERMES_LINE_OWNER_PIN
